<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BattleZone.io</title>
<style>
:root{--bg:#0a0e12;--pn:#111820;--ln:#243240;--tx:#e8eef3;--mu:#8795a3;--ac:#2ee6b0;--dg:#ff4a5c;--wn:#ffb224;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,12,.92);z-index:20;overflow:auto;padding:16px}
#menu{background:radial-gradient(circle at 70% 20%,#12303a 0,#0a0e12 55%)}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:22px;max-width:640px;width:100%;max-height:100%;overflow:auto}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:16px 0}

.m,.b{background:#16212b;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;cursor:pointer;transition:transform .1s,border-color .15s}
.m:hover,.b:hover{border-color:var(--ac)}.m:active,.b:active{transform:scale(.97)}
.m.on{border-color:var(--ac);background:#133a35}.m small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.go{background:var(--ac);color:#04231b;font-weight:900;font-size:20px;border:0;border-radius:6px;padding:14px;width:100%;cursor:pointer}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}

.opt select,.opt input[type=text]{background:#16212b;color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:6px}

.big{font:900 56px Impact,sans-serif;margin:0}.win{color:var(--ac)}.lose{color:var(--dg)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-size:14px;text-shadow:0 1px 2px #000}

#top{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:14px;background:rgba(8,12,16,.7);padding:6px 14px;border-radius:20px;font-weight:700;white-space:nowrap}
#zone{top:calc(46px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(8,12,16,.7);padding:4px 12px;border-radius:12px;font-size:12px;white-space:nowrap}

#feed{top:calc(10px + env(safe-area-inset-top,0px));right:10px;text-align:right;font-size:12px}#feed div{background:rgba(8,12,16,.65);margin-bottom:3px;padding:2px 8px;border-radius:4px}
#notes{top:22%;width:100%;text-align:center}#notes div{font-weight:700;font-size:18px;margin:4px}
#mm{left:10px;top:calc(10px + env(safe-area-inset-top,0px));border:2px solid var(--ln);border-radius:6px;background:#0a1410;width:150px;height:150px;transition:all .15s}
#mm.big{width:min(86vmin,560px);height:min(86vmin,560px);left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
#bars{left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(290px,60vw)}

#hp{background:linear-gradient(90deg,#e23,#4f6)}#ar{background:#4aa8ff}
#wp{font:700 18px Impact,sans-serif;margin-top:4px}#sl{color:var(--mu);font-size:12px}
#team{left:10px;top:176px;font-size:12px}#team div{margin-bottom:3px}
#vig{inset:0;box-shadow:inset 0 0 140px 30px rgba(255,0,30,.8);opacity:0;transition:opacity .25s}
#pb{top:calc(10px + env(safe-area-inset-top,0px));right:10px;top:auto;bottom:auto;pointer-events:auto;display:none}
#tc{display:none;inset:0}
body.t #tc{display:block}body.t #pb{display:block;top:calc(150px + env(safe-area-inset-top,0px))}
.st{position:absolute;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
.st i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
#tl{left:18px}#tr{right:18px}
.tb{position:absolute;pointer-events:auto;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;font-size:13px}
@media(max-width:560px){#bars{bottom:160px}#feed{top:130px;font-size:11px}#top{font-size:12px;gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
<div id="top"><span id="al"></span><span id="kl"></span><span id="tm"></span></div><div id="zone"></div><div id="warn"></div>
<div id="feed"></div><div id="notes"></div><canvas id="mm" width="150" height="150"></canvas><div id="team"></div>

<div id="vig"></div><button class="b" id="pb">II</button>
<div id="tc"><div class="st" id="tl"><i></i></div><div class="st" id="tr"><i></i></div>

<button class="tb" id="bF" style="right:150px;bottom:162px">HEAL</button><button class="tb" id="bQ" style="right:30px;bottom:160px">SWAP</button><button class="tb" id="bS" style="left:150px;bottom:30px">RUN</button></div>
</div>
<div id="menu" class="ov"><div class="box">
<h1>BATTLE<em>ZONE</em>.io</h1><p>Drop in, loot up, outlast the closing zone. Offline build: every mode is played against computer-controlled bots.</p>
<div class="modes" id="modes"></div>
<div class="opt"><label>Bots <input type="range" id="bn" min="1" max="19" value="11"> <b id="bnv">11</b></label>
<label>Difficulty <select id="df"><option>easy</option><option selected>normal</option><option>hard</option><option>mixed</option></select></label></div>

<div class="row"><button class="b" data-m="prof">Profile</button><button class="b" data-m="lb">Leaderboard</button><button class="b" data-m="set">Settings</button><button class="b" data-m="ctl">Controls</button></div>
</div></div>
<div id="lobby" class="ov hide"><div class="box" style="text-align:center"><h2 id="lt"></h2><p id="ls"></p><p class="big" id="lc" style="font-size:72px"></p><button class="b" id="lcx">Cancel</button></div></div>

<div id="modal" class="ov hide" style="z-index:30"><div class="box"><div id="mb"></div><button class="b" id="mx" style="margin-top:14px;width:100%">Close</button></div></div>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),R=(a,b)=>a+Math.random()*(b-a);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S=Object.assign({vol:.5,mute:false,sens:1,shake:true,name:'Player'},ld('bz_set',{}));
const W=2400,WEAP={ar:{n:'Assault Rifle',dmg:18,rate:120,range:640,mag:30,rl:2000,sp:.05,pel:1,am:'med',spd:1100,gl:26},
smg:{n:'SMG',dmg:10,rate:70,range:380,mag:35,rl:1700,sp:.1,pel:1,am:'lt',spd:1000,gl:20},
sg:{n:'Shotgun',dmg:11,rate:850,range:260,mag:6,rl:2400,sp:.22,pel:8,am:'sh',spd:900,gl:24},
sr:{n:'Sniper Rifle',dmg:80,rate:1300,range:1100,mag:5,rl:2600,sp:.004,pel:1,am:'hv',spd:1800,gl:34},
pi:{n:'Pistol',dmg:16,rate:300,range:420,mag:12,rl:1200,sp:.04,pel:1,am:'lt',spd:1000,gl:14}};
const AM={lt:['Light',30],med:['Medium',30],sh:['Shells',8],hv:['Heavy',5]};
const PH=[{r:700,w:25,s:20,d:1.5},{r:420,w:20,s:15,d:3},{r:220,w:15,s:12,d:5},{r:90,w:10,s:10,d:8},{r:20,w:8,s:8,d:12}];
const MODES={solo:{n:'Solo',ts:1,bots:11,d:'Free-for-all against bots. Last one standing wins.'},duo:{n:'Duo',ts:2,bots:15,d:'Teams of two. You get a bot partner; friendly fire is off.'},squad:{n:'Squad',ts:4,bots:15,d:'Teams of four with bot squadmates shown on your HUD.'},train:{n:'AI Training',ts:1,bots:7,d:'Practice with a custom bot count and difficulty. Restart any time from the pause menu.'},room:{n:'Custom Room',ts:1,bots:0,d:'Needs the online server.'}};
const DF={easy:{sight:380,err:.35,fp:.35,turn:3.5,rt:.6},normal:{sight:560,err:.15,fp:.75,turn:7,rt:.3},hard:{sight:780,err:.05,fp:1,turn:12,rt:.1}};
const BN=['Viper','Ghost','Rook','Nova','Blitz','Echo','Fang','Havoc','Drift','Onyx','Pyro','Quill','Raze','Sable','Talon','Umbra','Volt','Wraith','Zephyr','Jinx'];
/* ---------- map ---------- */
let sd=11;const rn=()=>{sd=sd*16807%2147483647;return sd/2147483647},rr=(a,b)=>a+rn()*(b-a);
const OB=[],BL=[],SP=[],DP=[];
function hit(x,y,r){for(const o of OB){if(o.r){const dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<(o.r+r)**2)return o}else{const cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h),dx=x-cx,dy=y-cy;if(dx*dx+dy*dy<r*r)return o}}return null}
function near(x,y,m){return BL.some(b=>x>b.x-m&&x<b.x+b.w+m&&y>b.y-m&&y<b.y+b.h+m)}
for(let i=0,n=0;i<300&&n<16;i++){const w=rr(150,230),h=rr(120,190),x=rr(120,W-120-w),y=rr(120,W-120-h);if(near(x,y,70)||near(x+w,y+h,70)||near(x+w,y,70)||near(x,y+h,70))continue;n++;const t=14,g=64,hx=x+(w-g)/2;BL.push({x,y,w,h});
OB.push({x,y,w:hx-x,h:t},{x:hx+g,y,w:x+w-hx-g,h:t},{x,y:y+h-t,w,h:t},{x,y,w:t,h},{x:x+w-t,y,w:t,h});SP.push({x:x+w/2,y:y+h/2},{x:x+w/2,y:y+h/2+30})}
for(let i=0;i<130;i++){const x=rr(40,W-40),y=rr(40,W-40);if(near(x,y,40))continue;const tr=i<90;OB.push({x,y,r:tr?rr(18,28):rr(14,22),k:tr?'t':'r'})}
for(let i=0;i<40;i++){const x=rr(60,W-60),y=rr(60,W-60);if(!hit(x,y,20))SP.push({x,y})}
for(let i=0;i<40;i++)DP.push({x:rr(0,W),y:rr(0,W),r:rr(50,140)});
/* ---------- state ---------- */
let g={state:'menu',t:0,sh:0,vig:0,hd:0,hdT:0,pause:false,mt:0},sel='solo',EN=[],BU=[],IT=[],PA=[],FD=[],P,Z,cam={x:W/2,y:W/2},K={},MX=0,MY=0,MD=false,TM={l:{x:0,y:0},r:{x:0,y:0},sp:false},vw=0,vh=0,dpr=1,lobT=null,cfg={};
const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;if(touch)document.body.classList.add('t');
const cv=$('c'),x=cv.getContext('2d'),mm=$('mm'),mx=mm.getContext('2d');
function rs(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}addEventListener('resize',rs);rs();
/* ---------- audio ---------- */
let ac;function snd(f,d,ty,v,sl,at){if(S.mute||!S.vol)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);gn.gain.setValueAtTime((v||.15)*S.vol*(at==null?1:at),n);gn.gain.exponentialRampToValueAtTime(.0005,n+d);o.connect(gn).connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
const att=e=>P?clamp(1-Math.hypot(e.x-cam.x,e.y-cam.y)/700,0,1):0;
/* ---------- entities ---------- */
function mk(i,team,bot,df){return{i,team,bot,df,name:bot?BN[i%20]+(i>19?i:''):S.name,x:0,y:0,vx:0,vy:0,a:0,hp:100,ar:0,sl:[{k:'pi',mag:12}],cur:0,res:{lt:36,med:0,sh:0,hv:0},kits:0,st:100,lock:false,alive:true,rl:0,last:0,heal:0,kills:0,dmg:0,shots:0,hits:0,fl:0,in:{mx:0,my:0,f:false,sp:false},nt:Math.random()*.3,dest:null,tg:null,err:0,rt:0,wt:0}}
function free(){for(let i=0;i<99;i++){const a=R(0,7),d=R(0,1000),px=1200+Math.cos(a)*d,py=1200+Math.sin(a)*d;if(!hit(px,py,40)&&!EN.some(e=>Math.hypot(e.x-px,e.y-py)<250&&e.alive))return{x:px,y:py}}return{x:1200,y:1200}}
function lootItem(p){const r=Math.random();if(r<.34){const ks=['ar','ar','ar','smg','smg','smg','sg','sg','sr','pi'];IT.push({x:p.x+R(-10,10),y:p.y+R(-10,10),t:'w',k:ks[Math.random()*10|0]})}else if(r<.66){const ks=['lt','lt','med','med','sh','hv'],k=ks[Math.random()*6|0];IT.push({x:p.x,y:p.y,t:'a',k,n:AM[k][1]})}else if(r<.84)IT.push({x:p.x,y:p.y,t:'k'});else IT.push({x:p.x,y:p.y,t:'r'})}
function nextZ(){Z.f={x:Z.cx,y:Z.cy,r:Z.r};const r=PH[Z.ph].r,a=R(0,7),d=Math.random()*(Z.r-r)*.9;Z.to={x:clamp(Z.cx+Math.cos(a)*d,r,W-r),y:clamp(Z.cy+Math.sin(a)*d,r,W-r),r}}
function start(){const M=MODES[sel];cfg={mode:sel,ts:M.ts,df:$('df').value,bots:+$('bn').value};let tot=cfg.bots+1;tot=Math.ceil(tot/cfg.ts)*cfg.ts;
EN=[];BU=[];IT=[];PA=[];FD=[];g={state:'play',t:0,sh:0,vig:0,hd:0,hdT:0,pause:false,mt:0,over:false,place:0};
for(let i=0;i<tot;i++)EN.push(mk(i,Math.floor(i/cfg.ts),i>0,cfg.df==='mixed'?['easy','normal','hard'][i%3]:cfg.df));P=EN[0];
const tc={};for(const e of EN){if(!tc[e.team])tc[e.team]=free();const c=tc[e.team];let p;for(let k=0;k<30;k++){p={x:c.x+R(-60,60),y:c.y+R(-60,60)};if(!hit(p.x,p.y,16))break}e.x=p.x;e.y=p.y;e.a=R(0,7)}
SP.forEach(lootItem);for(let i=0;i<30;i++)lootItem(free());
Z={cx:1200,cy:1200,r:1150,ph:0,state:'wait',t:PH[0].w,done:false};nextZ();cam.x=P.x;cam.y=P.y;
['menu','lobby','end','pause'].forEach(i=>$(i).classList.add('hide'));$('hud').classList.remove('hide');$('mm').classList.remove('big');note('Match started — loot up and watch the zone');snd(440,.2,'triangle',.2,200)}
/* ---------- combat ---------- */
function rld(e){const s=e.sl[e.cur],w=WEAP[s.k];if(e.rl||s.mag>=w.mag||e.res[w.am]<=0)return;e.rl=g.t+w.rl;if(e===P)snd(300,.15,'square',.1,-100)}
function shoot(e){const s=e.sl[e.cur],w=WEAP[s.k];s.mag--;e.last=g.t;e.shots+=w.pel;
for(let i=0;i<w.pel;i++){const a=e.a+R(-w.sp,w.sp);BU.push({x:e.x+Math.cos(e.a)*w.gl,y:e.y+Math.sin(e.a)*w.gl,vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,sp:w.spd,d:w.range,r0:w.range,dmg:w.dmg,o:e})}
if(e===P&&S.shake)g.sh=Math.min(7,g.sh+w.dmg/12);const at=att(e);if(at>0)snd(w.pel>1?110:w.dmg>50?90:210,.1,'sawtooth',.25,-90,at);if(s.mag<=0)rld(e)}
function dmgE(e,d,s,z){if(!e.alive)return;if(!z&&e.ar>0){const ab=Math.min(e.ar,d*.5);e.ar-=ab;d-=ab}e.hp-=d;e.fl=.1;if(s&&s!==e)s.dmg+=d;
if(e===P){g.vig=.7;if(s&&s!==e){g.hd=Math.atan2(s.y-e.y,s.x-e.x);g.hdT=.8}if(!z)snd(130,.12,'sawtooth',.2)}if(e.hp<=0)die(e,s,z)}
function die(e,s,z){e.alive=false;e.vx=e.vy=0;e.hp=0;e.rl=0;const dt=g.t;
const tx=s&&s!==e?`<b>${s.name}</b> eliminated ${e.name} (${WEAP[s.sl[s.cur].k].n})`:`${e.name} ${z?'died in the zone':'was eliminated'}`;FD.push({t:g.t,h:tx});
if(s&&s!==e){s.kills++;if(s===P){note('Eliminated '+e.name);snd(660,.25,'triangle',.25,300)}}
const cw=e.sl.find(q=>q.k!=='pi');if(cw)IT.push({x:e.x,y:e.y,t:'w',k:cw.k});if(e.kits)IT.push({x:e.x+10,y:e.y,t:'k'});
for(let i=0;i<14;i++)PA.push({x:e.x,y:e.y,vx:R(-150,150),vy:R(-150,150),l:.7,c:'#d22',s:3});
if(e===P){snd(90,.6,'sawtooth',.3,-50);note(EN.some(q=>q.alive&&q.team===P.team)?'You were eliminated — spectating teammate':'You were eliminated')}
const at=new Set(EN.filter(q=>q.alive).map(q=>q.team));if(g.over)return;
if(!at.has(P.team)){g.over=true;g.place=at.size+1;g.win=false;setTimeout(endScr,1500)}else if(at.size<=1){g.over=true;g.place=1;g.win=true;setTimeout(endScr,1500)}}
function pick(e,it){if(it.t==='w'){const w=WEAP[it.k],s=e.sl.find(q=>q.k===it.k);if(s)e.res[w.am]=Math.min(150,e.res[w.am]+w.mag);else if(e.sl.length<3){e.sl.push({k:it.k,mag:w.mag});if(!e.bot)e.cur=e.sl.length-1}else if(!e.bot){IT.push({x:it.x,y:it.y,t:'w',k:e.sl[e.cur].k});e.sl[e.cur]={k:it.k,mag:w.mag}}else return false;e.rl=0}
else if(it.t==='a')e.res[it.k]=Math.min(150,e.res[it.k]+it.n);else if(it.t==='k'){if(e.kits>=5)return false;e.kits++}else{if(e.ar>=100)return false;e.ar=Math.min(100,e.ar+50)}
if(e===P)snd(520,.1,'triangle',.2,300);return true}
function doPick(e){let bi=-1,bd=48;IT.forEach((it,i)=>{const d=Math.hypot(it.x-e.x,it.y-e.y);if(d<bd){bd=d;bi=i}});if(bi>=0&&pick(e,IT[bi])){IT.splice(bi,1)}}
function kit(e){if(e.kits>0&&e.hp<100&&e.heal<=0){e.kits--;e.heal=50;if(e===P)note('Using health kit…')}}

else{const h=ld('bz_hist',[]),f=k==='prof'?'all':(modal.f||'all'),now=Date.now(),lim=f==='day'?864e5:f==='week'?6048e5:1e20,H=h.filter(r=>now-r.t<lim),mt=H.length,w=H.reduce((a,r)=>a+r.w,0),kl=H.reduce((a,r)=>a+r.k,0),d=mt-w,best=H.reduce((a,r)=>Math.max(a,r.k),0),xp=h.reduce((a,r)=>a+r.xp,0);

m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{modal.f=b.dataset.f;modal('lb')})}}}

const up=e=>{if(e.pointerId!==pid)return;pid=null;o.on=false;o.x=o.y=0;kb.style.transform=''};el.onpointerup=up;el.onpointercancel=up}stick('tl',TM.l);stick('tr',TM.r);
